name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx eslint .

      # Build first: the TanStack Router Vite plugin generates
      # src/routeTree.gen.ts as a side effect of `vite build`. Typecheck
      # needs that file to exist, so build runs before typecheck.
      - name: Build (static Vite bundle)
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Typecheck
        run: bunx tsc --noEmit

      # No test suite yet — the app is still in Sprint 0/1 scaffolding, no
      # feature logic (circuit breaker, expiry, match-eligibility) exists to
      # test. Add a `bun test` step here once features/*/logic.ts modules
      # exist, per docs/YOKED_Build_Directives_v2.md §2.2/§3.2. Do not skip
      # this once that logic lands.
