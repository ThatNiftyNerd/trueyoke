name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_SECRETS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static web bundle
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The native Android project is already committed (Lovable manages it
      # directly), so this syncs the fresh web build into it rather than
      # regenerating the platform from scratch.
      - name: Capacitor sync
        run: bunx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        # Signed release builds are handled by the "Assemble release APK" step
        # below, using env-var-sourced signing config from GitHub Secrets.

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yoked-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: ${{ env.HAS_RELEASE_SECRETS == 'true' }}
        run: echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/yoked-release.keystore

      - name: Assemble release APK
        if: ${{ env.HAS_RELEASE_SECRETS == 'true' }}
        working-directory: android
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/android/app/yoked-release.keystore
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload release APK artifact
        if: ${{ env.HAS_RELEASE_SECRETS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: yoked-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

