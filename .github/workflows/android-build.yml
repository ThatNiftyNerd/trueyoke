name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_SECRETS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
      HAS_MANIFEST_SECRETS: ${{ secrets.RELEASE_PUBLISH_TOKEN != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static web bundle
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Google removed the legacy standalone "tools" package from the SDK
      # repository; android-actions/setup-android@v3 still requests it by
      # default and fails the whole job with "Failed to find package
      # 'tools'" / sdkmanager exit code 1 even though nothing in this
      # workflow needs it. Gradle resolves build-tools/platforms itself via
      # its own SDK auto-download once ANDROID_HOME and licenses are in
      # place, so pinning the explicit package list to platform-tools (which
      # this action does still install correctly) skips the broken default
      # install without losing anything the build actually uses.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      # The native Android project is already committed (Lovable manages it
      # directly), so this syncs the fresh web build into it rather than
      # regenerating the platform from scratch.
      - name: Capacitor sync
        run: bunx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        # Signed release builds are handled by the "Assemble release APK" step
        # below, using env-var-sourced signing config from GitHub Secrets.

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yoked-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: ${{ env.HAS_RELEASE_SECRETS == 'true' }}
        run: echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/yoked-release.keystore

      - name: Assemble release APK
        if: ${{ env.HAS_RELEASE_SECRETS == 'true' }}
        working-directory: android
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/android/app/yoked-release.keystore
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload release APK artifact
        if: ${{ env.HAS_RELEASE_SECRETS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: yoked-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Compute release metadata
        if: ${{ env.HAS_RELEASE_SECRETS == 'true' && env.HAS_MANIFEST_SECRETS == 'true' }}
        id: release_meta
        run: |
          SHA256=$(sha256sum android/app/build/outputs/apk/release/app-release.apk | cut -d' ' -f1)
          VERSION_CODE=$(grep -oP 'versionCode\s+\K\d+' android/app/build.gradle)
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)
          echo "sha256_hash=$SHA256" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Publish signed release manifest
        if: ${{ env.HAS_RELEASE_SECRETS == 'true' && env.HAS_MANIFEST_SECRETS == 'true' }}
        env:
          FUNCTION_URL: ${{ secrets.VITE_SUPABASE_URL }}/functions/v1/publish-release-manifest
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.RELEASE_PUBLISH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"version_code": ${{ steps.release_meta.outputs.version_code }}, "version_name": "${{ steps.release_meta.outputs.version_name }}", "platform": "android", "sha256_hash": "${{ steps.release_meta.outputs.sha256_hash }}", "release_notes": "CI build ${{ github.sha }}"}' \
            "$FUNCTION_URL"

      - name: Request APK upload URLs
        if: ${{ env.HAS_RELEASE_SECRETS == 'true' && env.HAS_MANIFEST_SECRETS == 'true' }}
        id: apk_upload_urls
        env:
          FUNCTION_URL: ${{ secrets.VITE_SUPABASE_URL }}/functions/v1/request-apk-upload
        run: |
          RESPONSE=$(curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.RELEASE_PUBLISH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"version_code": ${{ steps.release_meta.outputs.version_code }}, "version_name": "${{ steps.release_meta.outputs.version_name }}"}' \
            "$FUNCTION_URL")
          echo "latest_signed_url=$(echo "$RESPONSE" | jq -r '.latest.signedUrl')" >> $GITHUB_OUTPUT
          echo "archived_signed_url=$(echo "$RESPONSE" | jq -r '.archived.signedUrl')" >> $GITHUB_OUTPUT

      # These signed URLs are single-path, short-expiry, upload-only — not the
      # broad service-role key — so this step cannot read or write anything
      # else in the project even if the log or a stray retry leaked the URL.
      - name: Upload APK to public-releases bucket
        if: ${{ env.HAS_RELEASE_SECRETS == 'true' && env.HAS_MANIFEST_SECRETS == 'true' }}
        run: |
          curl --fail-with-body -sS \
            -X PUT \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @android/app/build/outputs/apk/release/app-release.apk \
            "${{ steps.apk_upload_urls.outputs.latest_signed_url }}"
          curl --fail-with-body -sS \
            -X PUT \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @android/app/build/outputs/apk/release/app-release.apk \
            "${{ steps.apk_upload_urls.outputs.archived_signed_url }}"
