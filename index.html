<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var stored = localStorage.getItem("trueyoke-theme");
        var isDark =
          stored === "dark" ||
          (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) document.documentElement.classList.add("dark");
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6B1724" />

      name="description"
      content="TrueYoke helps Church of Christ and conservative Christian singles pursue marriage-minded relationships with accountability."
    />

      property="og:description"
      content="TrueYoke helps Church of Christ and conservative Christian singles pursue marriage-minded relationships with accountability."
